# PyArmor Configuration for tlgeo2qgis QGIS Plugin
# Documentation: https://pyarmor.readthedocs.io/

[project]
name = "tlgeo2qgis"
version = "1.0.0"

[build]
# Files and directories to exclude from obfuscation
excludes = [
    "*.pyc",
    "__pycache__",
    "tests/*",
    "*.md",
    "*.txt",
    "*.png",
    "*.json",
    ".env*",
    "scripts/*",
]

# Include patterns (if needed)
# includes = [
#     "*.py"
# ]

[runtime]
# Runtime protection features
# Note: Advanced features may require PyArmor Pro license

# Prevent debugging (makes it harder to attach debuggers)
# anti_debug = true

# Detect code tampering
# anti_tamper = true

# Bind to specific machine (requires Pro)
# bind_machine = false

# Set expiration date (requires Pro)
# expired_date = "2025-12-31"

# For QGIS compatibility, we keep these features disabled by default
# Enable them if you have PyArmor Pro and need additional protection
